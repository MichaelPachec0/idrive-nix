name: Build and Publish

on:
  push:
    branches: [main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
  workflow_dispatch:

jobs:
  checks:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: DeterminateSystems/nix-installer-action@v20
      - run: nix flake check -L

  build:
    name: Build image (${{ matrix.arch }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            arch: arm64
            system: aarch64-linux
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: DeterminateSystems/nix-installer-action@v20

      - name: Read pinned version
        id: version
        run: |
          version=$(nix eval --raw .#idrive-client.version)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: nix build -L .#packages.${{ matrix.system }}.idrive-image

      # The registry pushes below need real DOCKERHUB_* and GHCR credentials.
      # A fork of this repository does not have those secrets, and a push
      # event to a fork's own main branch (or a manual dispatch there) would
      # otherwise hit these steps with blank credentials and fail with a
      # confusing login error instead of a clear "not applicable" skip.
      # github.event.repository.fork is true for any repository that GitHub
      # itself considers a fork, so this check needs no hardcoded repo name
      # and keeps working if this repository is renamed or re-forked again.
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event.repository.fork == false
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | nix run nixpkgs#skopeo -- login ghcr.io \
                -u "${{ github.actor }}" --password-stdin

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event.repository.fork == false
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" \
            | nix run nixpkgs#skopeo -- login docker.io \
                -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Push per-arch tags
        if: github.ref == 'refs/heads/main' && github.event.repository.fork == false
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          for repo in \
            "ghcr.io/${{ github.repository }}" \
            "docker.io/${{ secrets.DOCKERHUB_USERNAME }}/idrive-docker"; do
            nix run nixpkgs#skopeo -- copy \
              "docker-archive:./result" \
              "docker://$repo:$VERSION-$ARCH"
          done

  manifest:
    name: Merge multiarch manifest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event.repository.fork == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: DeterminateSystems/nix-installer-action@v20

      - name: Read pinned version
        id: version
        run: |
          version=$(nix eval --raw .#idrive-client.version)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Log in
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login docker.io \
            -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Create and push manifests
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for repo in \
            "ghcr.io/${{ github.repository }}" \
            "docker.io/${{ secrets.DOCKERHUB_USERNAME }}/idrive-docker"; do
            for tag in "$VERSION" latest; do
              docker manifest create "$repo:$tag" \
                --amend "$repo:$VERSION-amd64" \
                --amend "$repo:$VERSION-arm64"
              docker manifest push "$repo:$tag"
            done
          done
